<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Alagamentos · Rio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --painel: rgba(15, 23, 42, .78);
  --borda: rgba(148, 163, 184, .18);
  --texto: #e2e8f0;
  --suave: #94a3b8;
  --baixo: #22c55e; --moderado: #f59e0b; --alto: #ef4444;
}
body.claro {
  --painel: rgba(255, 255, 255, .85);
  --borda: rgba(15, 23, 42, .10);
  --texto: #0f172a;
  --suave: #475569;
}
* { box-sizing: border-box; }
html, body, #mapa { height: 100%; margin: 0; }
body { font-family: 'Inter', system-ui, sans-serif; color: var(--texto); }
#mapa { background: #0b1020; }
body.claro #mapa { background: #aad3df; }
body:not(.claro) .leaflet-tile-pane {
  filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.5);
}
.painel { position: absolute; z-index: 1000; background: var(--painel); color: var(--texto);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--borda); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#topo { top: 16px; left: 16px; width: 300px; padding: 18px 20px; }
h1 { font-size: 17px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
.status { font-size: 12px; color: var(--suave); display: flex; align-items: center; gap: 8px; }
.pulso { width: 8px; height: 8px; border-radius: 50%; background: var(--baixo); flex: none; animation: pulso 2s infinite; }
@keyframes pulso { 50% { opacity: .4; transform: scale(1.5); } }
.contagem { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 14px; }
.card { border-radius: 12px; padding: 10px 6px; text-align: center; background: rgba(148,163,184,.08); border: 1px solid var(--borda); }
.card b { display: block; font-size: 22px; font-weight: 700; }
.card span { font-size: 10px; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; }
.subtitulo { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin: 0 0 6px; }
#ranking { list-style: none; padding: 0; margin: 0; }
#ranking li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; cursor: pointer; font-size: 13px; }
#ranking li:hover { background: rgba(148,163,184,.14); }
.bolinha { width: 9px; height: 9px; border-radius: 50%; flex: none; }
#ranking .nome { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ranking .mm { font-variant-numeric: tabular-nums; color: var(--suave); }
#tema { top: 16px; right: 16px; width: 42px; height: 42px; cursor: pointer; font-size: 18px; padding: 0; }
.aviso { bottom: 16px; left: 16px; padding: 9px 14px; font-size: 11px; color: var(--suave); max-width: 300px; border-radius: 12px; }
.risco-baixo { filter: drop-shadow(0 0 5px rgba(34,197,94,.9)); }
.risco-moderado { filter: drop-shadow(0 0 7px rgba(245,158,11,.95)); }
.risco-alto { filter: drop-shadow(0 0 10px rgba(239,68,68,1)); }
.leaflet-popup-content-wrapper, .leaflet-tooltip { background: var(--painel); color: var(--texto);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--borda); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.leaflet-tooltip { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; }
.leaflet-tooltip-top:before { border-top-color: var(--painel); }
.leaflet-popup-tip { background: var(--painel); }
.leaflet-popup-content { margin: 14px 16px; font-family: 'Inter', sans-serif; }
.leaflet-container a.leaflet-popup-close-button { color: var(--suave); }
.leaflet-control-zoom a { background: var(--painel) !important; color: var(--texto) !important; border-color: var(--borda) !important; }
.leaflet-control-attribution { background: var(--painel) !important; color: var(--suave); }
.leaflet-control-attribution a { color: var(--suave); }
.pop h3 { margin: 0 0 8px; font-size: 15px; padding-right: 16px; }
.pop .linha { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; margin: 3px 0; }
.pop .linha span { color: var(--suave); }
.barra { height: 6px; border-radius: 3px; background: rgba(148,163,184,.25); margin-top: 10px; overflow: hidden; }
.barra div { height: 100%; border-radius: 3px; }
.etiqueta { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 999px; font-size: 11px;
  font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: .05em; }
@media (max-width: 600px) {
  #topo { width: calc(100% - 80px); padding: 14px 16px; }
  #ranking, .subtitulo, .aviso { display: none; }
}
#perto-btn { width: 100%; margin-top: 14px; padding: 10px; border-radius: 12px; cursor: pointer;
  border: 1px solid rgba(59,130,246,.4); background: rgba(59,130,246,.16); color: var(--texto);
  font: 600 13px 'Inter', system-ui, sans-serif; }
#perto-btn:hover { background: rgba(59,130,246,.28); }
#perto { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.45;
  background: rgba(148,163,184,.08); border: 1px solid var(--borda); border-left: 4px solid var(--baixo); }
#perto .titulo { display: block; font-size: 14px; margin-bottom: 4px; }
#perto .dica { color: var(--suave); font-size: 11px; margin-top: 8px; }
.dica-mapa { font-size: 11px; color: var(--suave); margin-top: 8px; }
.eu { filter: drop-shadow(0 0 8px rgba(59,130,246,.95)); }
@media (max-width: 600px) { .dica-mapa { display: none; } }
.prev-resumo { margin: 0 0 14px; padding: 10px 12px; border-radius: 12px; font-size: 12px;
  background: rgba(148,163,184,.08); border: 1px solid var(--borda); }
.prev-resumo .dica { color: var(--suave); font-size: 11px; margin-top: 4px; }
.prev-linha { margin-top: 8px; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="topo" class="painel">
  <h1>🌧️ Alagamentos · Rio</h1>
  <div class="status"><span class="pulso" id="pulso"></span><span id="status">Carregando…</span></div>
  <button id="perto-btn">📍 Perto de mim</button>
  <div id="perto"></div>
  <div class="dica-mapa">Dica: clique com o botão direito no mapa para simular outro local.</div>
  <div class="contagem">
    <div class="card"><b id="n-baixo" style="color:var(--baixo)">–</b><span>Baixo</span></div>
    <div class="card"><b id="n-moderado" style="color:var(--moderado)">–</b><span>Moderado</span></div>
    <div class="card"><b id="n-alto" style="color:var(--alto)">–</b><span>Alto</span></div>
  </div>
  <div id="prev-resumo" class="prev-resumo" style="display:none"></div>
  <p class="subtitulo">Mais chuva na última hora</p>
  <ul id="ranking"></ul>
</div>
<button id="tema" class="painel" title="Alternar tema claro/escuro">☀️</button>
<div class="aviso painel">Projeto independente, sem vínculo oficial. Em emergências, siga a Defesa Civil.</div>
<script>
const CORES = { baixo: '#22c55e', moderado: '#f59e0b', alto: '#ef4444' };
const ROTULO = { baixo: 'Baixo', moderado: 'Moderado', alto: 'Alto' };
let ESTACOES = [];
let primeiraVez = true;
let tema = 'escuro';
const marcadores = {};

const map = L.map('mapa', { zoomControl: false }).setView([-22.93, -43.40], 11);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);
const camada = L.layerGroup().addTo(map);

function popupHTML(p) {
  const pct = Math.min(100, Math.round(p.acumulado / p.limiar * 100));
  const cor = CORES[p.risco] || '#94a3b8';
  return `<div class="pop"><h3>${p.nome}</h3>
    <div class="linha"><span>Chuva na última hora</span><b>${p.acumulado} mm</b></div>
    <div class="linha"><span>Limiar da estação</span><b>${p.limiar} mm</b></div>
    <div class="barra"><div style="width:${pct}%;background:${cor}"></div></div>
    <span class="etiqueta" style="background:${cor}">Risco ${ROTULO[p.risco] || ''}</span>${linhaPrevisao(p)}</div>`;
}

async function atualizar() {
  try {
    const d = await (await fetch(REPLAY ? 'api/replay?momento=' + encodeURIComponent(momentoReplay) : 'api/risco')).json();
    ESTACOES = d.estacoes.filter(e => e.lat != null && e.lon != null);
    camada.clearLayers();
    ESTACOES.forEach(e => {
      const m = L.circleMarker([e.lat, e.lon], {
        radius: e.risco === 'alto' ? 12 : e.risco === 'moderado' ? 10 : 8,
        color: '#ffffff', weight: 1.5, opacity: 0.9,
        fillColor: CORES[e.risco] || '#94a3b8', fillOpacity: 0.95,
        className: 'risco-' + e.risco
      });
      m.bindPopup(popupHTML(e), { maxWidth: 290 });
      m.bindTooltip(e.nome, { direction: 'top', offset: [0, -8] });
      m.addTo(camada);
      if (e.previsto_risco === 'moderado' || e.previsto_risco === 'alto') {
        L.circleMarker([e.lat, e.lon], { radius: 17, color: CORES[e.previsto_risco], weight: 2,
          dashArray: '4 4', fill: false, interactive: false }).addTo(camada);
      }
      marcadores[e.id] = m;
    });
    if (primeiraVez && ESTACOES.length) {
      map.fitBounds(L.latLngBounds(ESTACOES.map(e => [e.lat, e.lon])), {
        paddingTopLeft: [window.innerWidth > 600 ? 340 : 20, 40], paddingBottomRight: [40, 40]
      });
      primeiraVez = false;
    }
    const n = { baixo: 0, moderado: 0, alto: 0 };
    ESTACOES.forEach(e => { if (e.risco in n) n[e.risco]++; });
    for (const k in n) document.getElementById('n-' + k).textContent = n[k];
    document.getElementById('pulso').style.background = n.alto ? CORES.alto : n.moderado ? CORES.moderado : CORES.baixo;
    const top = [...ESTACOES].sort((a, b) => b.acumulado - a.acumulado).slice(0, 5);
    document.getElementById('ranking').innerHTML = top.map(e =>
      `<li data-id="${e.id}"><span class="bolinha" style="background:${CORES[e.risco]}"></span>` +
      `<span class="nome">${e.nome}</span><span class="mm">${e.acumulado} mm</span></li>`).join('');
    document.getElementById('status').textContent = `Atualizado às ${d.atualizado} · ${d.modo}`;
    resumoPrevisao();
    avaliarPerto();
  } catch (err) {
    document.getElementById('status').textContent = 'Erro ao carregar dados. O servidor está ligado?';
  }
}

document.getElementById('ranking').addEventListener('click', ev => {
  const li = ev.target.closest('li');
  if (!li) return;
  const e = ESTACOES.find(x => String(x.id) === li.dataset.id);
  if (!e) return;
  map.flyTo([e.lat, e.lon], 14, { duration: 1.5 });
  map.once('moveend', () => { if (marcadores[e.id]) marcadores[e.id].openPopup(); });
});

document.getElementById('tema').addEventListener('click', () => {
  tema = tema === 'escuro' ? 'claro' : 'escuro';
  document.body.classList.toggle('claro', tema === 'claro');
  document.getElementById('tema').textContent = tema === 'escuro' ? '☀️' : '🌙';
});

// ---------- Localização: risco perto de mim ----------
let minhaPos = null, marcadorEu = null, circuloEu = null, linhaEu = null;
let observando = null, centralizou = false;

function distKm(lat1, lon1, lat2, lon2) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function km(d) { return d < 1 ? Math.round(d * 1000) + ' m' : d.toFixed(1).replace('.', ',') + ' km'; }

function mostrarPerto(html, risco) {
  const el = document.getElementById('perto');
  el.innerHTML = html;
  el.style.display = 'block';
  el.style.borderLeftColor = risco ? CORES[risco] : 'var(--suave)';
}

function avaliarPerto() {
  if (!minhaPos || !ESTACOES.length) return;
  const ordem = { baixo: 0, moderado: 1, alto: 2 };
  const lista = ESTACOES.map(e => ({ ...e, d: distKm(minhaPos.lat, minhaPos.lon, e.lat, e.lon) }))
                        .sort((a, b) => a.d - b.d);
  const perto = lista[0];
  const raio = Math.max(3, perto.d + 0.5);
  const vizinhas = lista.filter(e => e.d <= raio);
  const pior = vizinhas.reduce((p, e) => (ordem[e.risco] > ordem[p.risco] ? e : p), perto);
  const origem = minhaPos.simulada ? 'Local simulado' : 'Sua localização';
  let titulo, texto;
  if (pior.risco === 'alto') {
    titulo = '⚠️ Risco alto de alagamento perto de você';
    texto = `Estação ${pior.nome}, a ${km(pior.d)}: ${pior.acumulado} mm na última hora (limiar ${pior.limiar} mm). Evite ruas baixas, túneis e passagens que costumam alagar.`;
  } else if (pior.risco === 'moderado') {
    titulo = '🌧️ Atenção: chuva forte perto de você';
    texto = `Estação ${pior.nome}, a ${km(pior.d)}: ${pior.acumulado} mm na última hora. Fique de olho e evite áreas que costumam alagar.`;
  } else {
    titulo = '✅ Tudo tranquilo perto de você';
    texto = `Estação mais próxima: ${perto.nome}, a ${km(perto.d)}, com ${perto.acumulado} mm na última hora.`;
  }
  let dica = `${origem} · ${vizinhas.length} estação(ões) num raio de ${km(raio)}`;
  if (perto.d > 8) dica = `${origem} · a estação mais próxima está a ${km(perto.d)}, então o risco pode não representar bem o seu local.`;
  const piorPrev = vizinhas.reduce((p, e) => ((ordem[e.previsto_risco] ?? -1) > (ordem[p.previsto_risco] ?? -1) ? e : p), vizinhas[0]);
  const prevTxt = piorPrev && piorPrev.previsto_risco ? linhaPrevisaoPerto(piorPrev) : '';
  mostrarPerto(`<b class="titulo">${titulo}</b>${texto}${prevTxt}<div class="dica">${dica}</div>`, pior.risco);

  if (linhaEu) map.removeLayer(linhaEu);
  linhaEu = L.polyline([[minhaPos.lat, minhaPos.lon], [pior.lat, pior.lon]],
    { color: CORES[pior.risco] || '#94a3b8', weight: 2, dashArray: '6 6', opacity: 0.85 }).addTo(map);
}

function definirPosicao(lat, lon, precisao, simulada) {
  minhaPos = { lat, lon, simulada };
  if (!marcadorEu) {
    circuloEu = L.circle([lat, lon], { radius: precisao || 0, color: '#3b82f6', weight: 1, fillOpacity: 0.1 }).addTo(map);
    marcadorEu = L.circleMarker([lat, lon], { radius: 8, color: '#ffffff', weight: 3,
      fillColor: '#3b82f6', fillOpacity: 1, className: 'eu' }).addTo(map);
    marcadorEu.bindTooltip('Você', { direction: 'top', offset: [0, -8] });
  } else {
    marcadorEu.setLatLng([lat, lon]);
    circuloEu.setLatLng([lat, lon]).setRadius(precisao || 0);
  }
  if (!centralizou && !simulada) {
    map.flyTo([lat, lon], 14, { duration: 1.2 });
    centralizou = true;
  }
  avaliarPerto();
}

document.getElementById('perto-btn').addEventListener('click', () => {
  const btn = document.getElementById('perto-btn');
  if (!navigator.geolocation) {
    return mostrarPerto('<b class="titulo">Localização indisponível</b>Seu navegador não permite localização.', null);
  }
  btn.textContent = '📍 Procurando você…';
  if (observando !== null) navigator.geolocation.clearWatch(observando);
  centralizou = false;
  observando = navigator.geolocation.watchPosition(
    pos => {
      btn.textContent = '📍 Perto de mim';
      definirPosicao(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, false);
    },
    err => {
      btn.textContent = '📍 Perto de mim';
      mostrarPerto('<b class="titulo">Não consegui sua localização</b>' +
        (err.code === 1 ? 'Você não deu permissão. Libere a localização nas configurações do navegador.'
                        : 'Tente de novo daqui a pouco.'), null);
    },
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
});

map.on('contextmenu', ev => {
  if (observando !== null) { navigator.geolocation.clearWatch(observando); observando = null; }
  definirPosicao(ev.latlng.lat, ev.latlng.lng, 0, true);
});

// ---------- Previsão: próximas 3 horas ----------
function textoPrevisao(e) {
  if (!e.previsto_mm) return 'sem chuva prevista';
  return `pico de ${e.previsto_mm} mm/h às ${e.previsto_hora} · risco ${ROTULO[e.previsto_risco].toLowerCase()}`;
}
function linhaPrevisao(e) {
  if (!e.previsto_risco) return '';
  const cor = e.previsto_risco === 'baixo' ? 'var(--suave)' : CORES[e.previsto_risco];
  return `<div class="prev-linha" style="color:${cor}">⏳ Próximas 3h: ${textoPrevisao(e)}</div>`;
}
function linhaPrevisaoPerto(e) {
  if (e.previsto_risco === 'baixo') {
    return '<div class="prev-linha" style="color:var(--suave)">⏳ Próximas 3h: sem risco previsto</div>';
  }
  return `<div class="prev-linha" style="color:${CORES[e.previsto_risco]}">⏳ Próximas 3h: risco ` +
    `${ROTULO[e.previsto_risco].toLowerCase()} previsto às ${e.previsto_hora} (${e.nome}, ${e.previsto_mm} mm/h)</div>`;
}
function resumoPrevisao() {
  const el = document.getElementById('prev-resumo');
  const comPrev = ESTACOES.filter(e => e.previsto_risco);
  if (!comPrev.length) { el.style.display = 'none'; return; }
  const al = comPrev.filter(e => e.previsto_risco === 'alto').length;
  const mo = comPrev.filter(e => e.previsto_risco === 'moderado').length;
  const nota = REPLAY ? 'No replay, a previsão usa a chuva que realmente caiu depois.'
                      : 'Anel tracejado no mapa = risco previsto.';
  el.style.display = 'block';
  el.innerHTML = (al + mo === 0
    ? '⏳ <b>Próximas 3h:</b> sem risco previsto'
    : `⏳ <b>Próximas 3h:</b> <b style="color:${CORES.alto}">${al} alto</b> · ` +
      `<b style="color:${CORES.moderado}">${mo} moderado</b>`) + `<div class="dica">${nota}</div>`;
}

const REPLAY = location.pathname.endsWith('/replay');
let momentos = [], idx = 0, tocando = false, timer = null, momentoReplay = '';

function formatar(m) {
  const [d, h] = m.split('T');
  const [, mes, dia] = d.split('-');
  return `${dia}/${mes} ${h.slice(0, 5)}`;
}

async function iniciarReplay() {
  const css = document.createElement('style');
  css.textContent = `
    #replay { left: 50%; transform: translateX(-50%); bottom: 16px; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px; width: min(560px, calc(100% - 32px)); }
    #replay button { background: var(--alto); color: #fff; border: 0; border-radius: 10px;
      width: 40px; height: 40px; font-size: 15px; cursor: pointer; flex: none; }
    #replay input { flex: 1; accent-color: var(--alto); }
    #replay .hora { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px;
      min-width: 92px; text-align: right; }
    .aviso { display: none; }`;
  document.head.appendChild(css);
  const barra = document.createElement('div');
  barra.id = 'replay';
  barra.className = 'painel';
  barra.innerHTML = '<button id="play" title="Play/pausa">▶</button>' +
    '<input id="tempo" type="range" min="0" value="0"><span class="hora" id="hora">–</span>';
  document.body.appendChild(barra);

  const info = await (await fetch('api/replay/momentos')).json();
  momentos = info.momentos;
  if (!momentos.length) {
    document.getElementById('status').textContent = 'Sem dados de replay. Rode: python replay_baixar.py';
    return;
  }
  const tempo = document.getElementById('tempo');
  const play = document.getElementById('play');
  tempo.max = momentos.length - 1;

  const ir = async i => {
    idx = i;
    tempo.value = i;
    momentoReplay = momentos[i];
    document.getElementById('hora').textContent = formatar(momentos[i]);
    await atualizar();
  };
  const pausar = () => { tocando = false; clearInterval(timer); play.textContent = '▶'; };

  tempo.addEventListener('input', () => { pausar(); ir(+tempo.value); });
  play.addEventListener('click', () => {
    if (tocando) return pausar();
    if (idx >= momentos.length - 1) ir(0);
    tocando = true;
    play.textContent = '❚❚';
    timer = setInterval(() => { idx >= momentos.length - 1 ? pausar() : ir(idx + 1); }, 800);
  });
  ir(0);
}

if (REPLAY) {
  iniciarReplay();
} else {
  atualizar();
  setInterval(atualizar, 60000);
}
</script>
</body>
</html>
